<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAMSI SYSTEM - Spare Parts Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        h1 { color: #1a365d; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #2b6cb0; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2c5282; }
    </style>
</head>
<body>

    <h1>🚛 SHAMSI SYSTEM - USAMBAZAJI NA SPEA ZA MAGARI</h1>

    <div class="card">
        <h2>Fomu ya Kusajili Spea Mpya (Spares Master)</h2>
        <form id="spareForm">
            <div class="form-group">
                <label>Part Number:</label>
                <input type="text" placeholder="k.m. 1314383" required>
            </div>
            <div class="form-group">
                <label>OEM Number:</label>
                <input type="text" placeholder="k.m. OEM-SCANIA-001">
            </div>
            <div class="form-group">
                <label>Jina la Spea (Spare Name):</label>
                <input type="text" placeholder="k.m. Oil Filter Scania" required>
            </div>
            <div class="form-group">
                <label>Aina/Model ya Gari (Vehicle Model):</label>
                <input type="text" placeholder="k.m. Scania R480 / Actros">
            </div>
            <div class="form-group">
                <label>Location (Zone / Shelf / Bin):</label>
                <input type="text" placeholder="k.m. Zone A - Shelf 2 - Bin 04">
            </div>
            <button type="button" onclick="alert('Spea imesajiliwa kikamilifu!')">Hifadhi Spea</button>
        </form>
    </div>

</body>
</html>
